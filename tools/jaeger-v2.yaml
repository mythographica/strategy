# Jaeger v2 all-in-one (memory) with the AI MCP telemetry endpoint enabled.
# Stock cmd/jaeger/config.yaml, trimmed: no agent_url chat gateway, no
# archive store, no adaptive sampling. The `ai.enable_mcp: true` line is what
# turns on /api/ai/mcp/ on the query port (:16686) — the official agent surface
# (search_traces, get_trace_topology, get_critical_path, ...).
#
# The `ui.config_file` mount adds link patterns (jaeger-ui.json): span tags
# `code.filepath` become `vscode://file/...` jumps and `dive.root_edge_id`
# becomes a `vscode://mnemonica.mnemographica/trace?root=N` jump into the
# Live Trace sidebar (Wanted #1). The browser asks once for permission to
# open the vscode:// protocol.
#
# Run (from the strategy repo root):
#   npm run jaegger:pre-configured        # → bin/Jaegger-conf.sh (idempotent)
# or by hand:
#   docker run -d --name jaeger-mnem \
#     -p 16686:16686 -p 4318:4318 \
#     -v /code/mnemonica/strategy/tools/jaeger-v2.yaml:/etc/jaeger/config.yaml \
#     -v /code/mnemonica/strategy/tools/jaeger-ui.json:/etc/jaeger/ui.json \
#     jaegertracing/jaeger:latest --config /etc/jaeger/config.yaml

service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger

extensions:
  jaeger_query:
    storage:
      traces: some_store
    ai:
      # Serves the telemetry MCP tools at /api/ai/mcp/ on the query port.
      enable_mcp: true
    ui:
      config_file: /etc/jaeger/ui.json

  jaeger_storage:
    backends:
      some_store:
        memory:
          max_traces: 100000

receivers:
  otlp:
    protocols:
      # Explicit 0.0.0.0: the otlp default is loopback, which the published
      # docker port cannot reach from the host.
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: some_store
